{{- define "main" }}
{{- $image := .Params.image -}}
{{- $parent := .Params.parent | default "/" -}}
<style>
.header,
.footer {
  display: none !important;
}

.main {
  max-width: none;
  margin: 0;
  padding: 0;
}

body {
  background: #101010;
}

.image-viewer {
  min-height: 100vh;
  background: #101010;
}

.image-viewer__bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 1rem;
  color: #f7f7f7;
  background: rgba(16, 16, 16, 0.9);
  backdrop-filter: blur(10px);
}

.image-viewer__back {
  color: #f7f7f7;
  text-decoration: none;
}

.image-viewer__title {
  color: #d6d6d6;
  font-size: 0.95rem;
}

.image-viewer__image {
  display: block;
  width: 100%;
  max-width: 1200px;
  height: auto;
  margin: 0 auto;
}

@media (max-width: 700px) {
  .image-viewer__bar {
    padding: 0.65rem 0.8rem;
  }
}
</style>

<section class="image-viewer">
  <div class="image-viewer__bar">
    <a class="image-viewer__back" href="{{ $parent }}">返回文章</a>
    <span class="image-viewer__title">{{ .Title }}</span>
  </div>
  <img class="image-viewer__image" src="{{ $image }}" alt="{{ .Title }}">
</section>
{{- end }}
