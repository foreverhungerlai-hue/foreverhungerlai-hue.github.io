baseURL = "https://tataeeanxoy.top/"
locale = "en-US"
title = "Tataee"
timeZone = "Asia/Shanghai"
theme = "PaperMod"

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  mainSections = ["technical"]
[params.assets]
  customCSS = ["css/extended/custom.css"]

  [[params.socialIcons]]
    name = "instagram"
    url = "https://instagram.com/365ailier"

  [[params.socialIcons]]
    name = "mastodon"
    url = "https://alive.bar/@Tatachibubao"

  [params.profileMode]
    enabled = false
    title = "Tataee / Lab Notes"
    subtitle = "Methods, experiments, and reproducible research notes."
    imageUrl = "/images/avatar.jpg"
    imageWidth = 150
    imageHeight = 150
    imageTitle = "avatar"

  [params.homeInfoParams]
    Title = "Lab Note Archive"
    Content = "Practical protocols, experimental decisions, and research notes from a plant molecular biology bench. Written to be used, checked, and improved."

  [params.label]
    text = "Tataee / Lab Notes"

[[menu.main]]
  name = "Lab Notes"
  url = "/technical/"
  weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
