baseURL = "https://tataeeanxoy.top/"
languageCode = "zh-cn"
title = "文献阅读笔记"
theme = "PaperMod"

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  mainSections = ["papers"]

  [params.profileMode]
    enabled = true
    title = "文献阅读笔记"
    subtitle = "整理正在读、已经读过、值得回看的论文。"
    imageUrl = ""

[[menu.main]]
  name = "文献"
  url = "/papers/"
  weight = 1

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 2

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
